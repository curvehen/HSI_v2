name: Weekly Walk-Forward Retrain & Validation

on:
  schedule:
    - cron: '0 2 * * 6'
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python train.py
      - name: Commit results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add predictions/
          git commit -m "Weekly walk-forward validation $(date +%F)" || echo "No changes"
          git push
