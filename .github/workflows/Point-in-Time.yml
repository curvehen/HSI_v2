name: Run 2026 Point-in-Time Simulation

on:
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: mkdir -p predictions
      - run: python run_simulation.py
      - name: Commit results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add predictions/daily_simulation_2026.csv
          git commit -m "2026 point-in-time simulation results" || echo "No changes"
          git push
